# HTTPS do servidor da fábrica.
#
# O app E a API do Supabase são servidos pelo MESMO endereço, de propósito.
# Uma página em https:// não pode chamar uma API em http:// — o navegador
# bloqueia como "conteúdo misto". Colocar os dois na mesma origem resolve isso
# e ainda dispensa configuração de CORS: para o navegador, é tudo o mesmo site.
#
# Endereço final: https://IP-DO-SERVIDOR
#   /              -> arquivos do app (index.html, app.js, vendor/)
#   /rest/ /auth/ /storage/ /realtime/  -> Supabase (Kong, porta 8000)

# O Realtime usa WebSocket, que exige repassar os cabeçalhos de "upgrade".
# Sem este map a conexão cai e o app volta a depender só da checagem de 15s.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Quem digitar http:// vai para o https:// — evita o caso em que alguém usa o
# endereço antigo e fica sem as funções de pasta sem entender por quê.
server {
  listen 80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;

  ssl_certificate     /etc/nginx/tls/servidor.crt;
  ssl_certificate_key /etc/nginx/tls/servidor.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;

  # As imagens de desenho sobem por aqui; o padrão do nginx (1 MB) barraria.
  client_max_body_size 25m;

  root  /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
    # O app.js já usa ?v=... para forçar atualização; sem isto o navegador
    # poderia servir o index.html velho e ignorar a versão nova.
    add_header Cache-Control "no-cache";
  }

  location ~ ^/(rest|auth|storage|realtime|functions)/ {
    proxy_pass http://host.docker.internal:8000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # WebSocket do Realtime
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # A conexão do Realtime fica aberta; o padrão de 60s a derrubaria de minuto
    # em minuto, e a sincronização entre máquinas ficaria intermitente.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
