# HTTPS do servidor da fábrica.
#
# O app E a API do Supabase são servidos pelo MESMO endereço, de propósito.
# Uma página em https:// não pode chamar uma API em http:// — o navegador
# bloqueia como "conteúdo misto". Colocar os dois na mesma origem resolve isso
# e ainda dispensa configuração de CORS: para o navegador, é tudo o mesmo site.
#
# Endereço final: https://IP-DO-SERVIDOR
#   /              -> arquivos do app (index.html, app.js, vendor/)
#   /rest/ /auth/ /storage/ /realtime/  -> Supabase (Kong, porta 8000)

# -------------------------------------------------------------------------
# O AVISO DE IPv6 NO LOG DE ERRO — INVESTIGADO EM 17/08/2026, DEIXADO COMO ESTÁ
#
# No log aparece, de tempo em tempo:
#   connect() to [fdc4:f303:9324::254]:8000 failed (101: Network unreachable)
#   upstream server temporarily disabled while connecting to upstream
#
# Causa: o Docker Desktop escreve DUAS linhas no /etc/hosts do container para
# `host.docker.internal` — a IPv4 (192.168.65.254) e uma IPv6 que não vai a
# lugar nenhum nesta máquina. O nginx tenta a IPv6 primeiro, falha na hora
# (101 é imediato, não é espera), marca aquele endereço como fora por ~10s e
# atende pela IPv4 na mesma requisição. A resposta sai certa; o custo é uma
# tentativa perdida por janela de 10s e a linha no log.
#
# DUAS TENTATIVAS DE CONSERTO FORAM MEDIDAS E AS DUAS SÃO PIORES:
#
#  1. Nome dedicado (`kong-host:host-gateway` no docker-compose): o Docker
#     mapeia `host-gateway` para IPv4 **e** IPv6 também. Não muda nada.
#  2. `resolver 127.0.0.11 ipv6=off` + proxy_pass por variável: resolve em
#     tempo de requisição, só A. Testado num container à parte na mesma rede:
#     as primeiras chamadas passaram e as seguintes tomaram
#     `host.docker.internal could not be resolved (2: Server failure)` — o DNS
#     interno do Docker não responde por esse nome de forma confiável (ele vive
#     no /etc/hosts, não como registro de DNS). Resultado: 503 de @subindo, ou
#     seja, "o servidor está ligando agora" na cara de quem estava usando.
#     Trocar um aviso no log por falso alarme na tela é piorar.
#
# A terceira saída — fixar `192.168.65.254` no compose — funciona e cria uma
# dependência muda de um endereço interno do Docker: no dia em que ele mudar, a
# API para inteira e o vigia não conserta. Não vale.
#
# Então: NÃO É PARA CONSERTAR. Se este aviso aparecer numa investigação, ele é
# ruído conhecido — não é a causa de lentidão nem de erro para o usuário.
# -------------------------------------------------------------------------

# O Realtime usa WebSocket, que exige repassar os cabeçalhos de "upgrade".
# Sem este map a conexão cai e o app volta a depender só da checagem de 15s.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Quem digitar http:// vai para o https:// — evita o caso em que alguém usa o
# endereço antigo e fica sem as funções de pasta sem entender por quê.
#
# COM UMA EXCEÇÃO: a página que instala o certificado. Quem precisa dela é
# justamente quem ainda NÃO confia no certificado — mandar essa pessoa para o
# https: é entregá-la à tela vermelha antes de ela ler a primeira palavra, que
# é o problema que ela veio resolver. Aqui não há segredo: a página é uma
# instrução e o ca.crt é público por natureza (ele não abre nada, só diz em
# quem confiar).
server {
  listen 80;

  root /usr/share/nginx/html;

  location = /instalar/ca.crt {
    alias /etc/nginx/tls/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="ca.crt"';
  }
  location = /instalar/instalar-certificado.cmd {
    alias /usr/share/nginx/html/servidor/instalar-certificado.cmd;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="instalar-certificado.cmd"';
  }
  location ^~ /instalar/ {
    try_files $uri $uri/ /instalar/index.html;
    add_header Cache-Control "no-cache";
  }
  # O /ca.crt sozinho continua valendo pelos dois protocolos: é o endereço que
  # já estava escrito nas anotações antigas.
  location = /ca.crt {
    alias /etc/nginx/tls/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="ca.crt"';
  }

  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;

  ssl_certificate     /etc/nginx/tls/servidor.crt;
  ssl_certificate_key /etc/nginx/tls/servidor.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;

  # As imagens de desenho sobem por aqui; o padrão do nginx (1 MB) barraria.
  client_max_body_size 25m;

  root  /usr/share/nginx/html;
  index index.html;

  # ------------------------------------------------------------------ segredos
  # A raiz aqui é a pasta INTEIRA do Gerador-OS, não só os arquivos do app. Sem
  # os bloqueios abaixo, qualquer máquina da rede baixa pelo navegador:
  #   servidor/tls/ca.key      -> emite certificado em nome da nossa autoridade
  #   servidor/tls/*.key       -> a chave privada do próprio servidor
  #   backups/*.json           -> a base inteira da fábrica, num arquivo só
  #   .git/                    -> todo o histórico, e o que já passou por ele
  # Negar por nome é o certo: o que o app precisa é pouco e conhecido, o que
  # não pode vazar é que cresce a cada arquivo novo na pasta.
  location ^~ /servidor/ { deny all; }
  location ^~ /backups/  { deny all; }
  location ^~ /testes/   { deny all; }
  location ~  /\.        { deny all; }   # .git, .env e afins

  # O ca.crt é a exceção, e é público por natureza: ele não abre nada, só diz
  # às máquinas em quem confiar. Servir aqui evita a volta de pendrive — em
  # cada computador basta abrir https://IP-DO-SERVIDOR/ca.crt e instalar.
  location = /ca.crt {
    alias /etc/nginx/tls/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="ca.crt"';
  }

  # Como o programa descobre sozinho com quem falar. Só o endereço e a chave
  # anônima, que é pública por natureza — ela já vai dentro de cada navegador
  # que abre o app. Fica fora do repositório (servidor/tls é ignorado pelo git)
  # porque é específica desta instalação, não do programa.
  # Os mesmos dois arquivos do instalador, aqui pelo https. A pasta
  # `instalar/` em si cai no `location /` normal; estes dois precisam de alias
  # porque um mora em servidor/tls (negado) e o outro em servidor/ (negado).
  location = /instalar/ca.crt {
    alias /etc/nginx/tls/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="ca.crt"';
  }
  location = /instalar/instalar-certificado.cmd {
    alias /usr/share/nginx/html/servidor/instalar-certificado.cmd;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="instalar-certificado.cmd"';
  }

  location = /servidor-local.json {
    alias /etc/nginx/tls/servidor-local.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ =404;
    # O app.js já usa ?v=... para forçar atualização; sem isto o navegador
    # poderia servir o index.html velho e ignorar a versão nova.
    add_header Cache-Control "no-cache";
  }

  # ------------------------------------------------- o servidor ainda subindo
  # Toda manhã existe uma janela de alguns minutos em que ESTE nginx já responde
  # e o Supabase ainda não: o container do app volta sozinho pelo "restart:
  # always" assim que o motor do Docker liga, e o Supabase só sobe quando o vigia
  # manda "up -d" — em 13/08/2026 foram quatro minutos de diferença. Nessa janela
  # a página abre e toda chamada à API morre com "502 Bad Gateway", que para quem
  # usa parece o programa quebrado, e não a máquina acordando.
  #
  # A resposta sai em JSON, e não em HTML, porque quem recebe é o supabase-js
  # dentro do app, não o navegador: HTML aqui daria erro de "JSON inválido" e a
  # tela mostraria algo pior que o 502. Os nomes repetidos também são de
  # propósito — o cliente REST lê "message", e o de login lê "msg" e
  # "error_description"; sem os três, uma das duas telas voltaria ao texto em inglês.
  location @subindo {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"code":"servidor_subindo","message":"O servidor da fábrica está ligando agora. Espere 2 a 3 minutos e recarregue a página (Ctrl+Shift+R). Nada foi perdido.","msg":"O servidor da fábrica está ligando agora. Espere 2 a 3 minutos e recarregue a página (Ctrl+Shift+R). Nada foi perdido.","error":"servidor_subindo","error_description":"O servidor da fábrica está ligando agora. Espere 2 a 3 minutos e recarregue a página (Ctrl+Shift+R). Nada foi perdido.","hint":"O Supabase ainda não terminou de subir."}';
  }

  # ------------------------------------------------------- o Supabase engasgado
  # Kong respondeu a conexão mas não devolveu a resposta no prazo. É diferente do
  # 502 acima (ninguém atendeu): aqui alguém atendeu e ficou pensando — lock no
  # Postgres, pool de conexões cheio, container em swap. O texto é outro porque a
  # ação é outra: não é esperar o servidor subir, é olhar por que ele travou.
  location @lento {
    default_type application/json;
    add_header Retry-After 15 always;
    add_header Cache-Control "no-store" always;
    return 504 '{"code":"servidor_lento","message":"O servidor da fábrica recebeu o pedido e não respondeu no prazo. Nada foi perdido: o programa vai tentar de novo. Se repetir, reinicie o Supabase no servidor.","msg":"O servidor da fábrica recebeu o pedido e não respondeu no prazo. Nada foi perdido: o programa vai tentar de novo.","error":"servidor_lento","error_description":"O servidor da fábrica recebeu o pedido e não respondeu no prazo. Nada foi perdido: o programa vai tentar de novo.","hint":"Kong/Postgres nao respondeu dentro do proxy_read_timeout."}';
  }

  # ------------------------------------------------------------------- Realtime
  # SEPARADO do resto de propósito. A conexão WebSocket fica aberta o tempo todo,
  # e é só por causa dela que existe o prazo de uma hora — que, aplicado também
  # ao /rest/, fazia uma gravação travada ficar UMA HORA pendurada: o navegador
  # sem prazo do outro lado, o programa preso em "Salvando..." e a sessão inteira
  # sem conseguir salvar até alguém recarregar a página.
  location ~ ^/realtime/ {
    proxy_pass http://host.docker.internal:8000;
    proxy_http_version 1.1;
    error_page 502 503 504 = @subindo;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # A conexão fica aberta; o padrão de 60s a derrubaria de minuto em minuto, e a
    # sincronização entre máquinas ficaria intermitente.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # --------------------------------------------------------- API (dados, login)
  location ~ ^/(rest|auth|storage|functions)/ {
    proxy_pass http://host.docker.internal:8000;
    proxy_http_version 1.1;

    # Só troca o 502 quando o erro é DAQUI (conexão recusada, upstream sem vida)
    # — o proxy_intercept_errors fica desligado de propósito: 502/503 que venham
    # do próprio Kong são resposta de verdade e não podem virar "aguarde".
    error_page 502 503 = @subindo;
    # E o estouro de prazo tem mensagem própria: o pedido chegou, a resposta não
    # veio. Melhor um erro claro em 1 minuto do que uma hora de espera muda.
    error_page 504 = @lento;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Prazos de gente: a rede é local e o blob (~1,8 MB) sobe em menos de 1s.
    # Um minuto é folga de sobra para a imagem de um desenho, e é o teto do que
    # faz sentido esperar por uma resposta antes de avisar quem está usando.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }
}
